[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "ruff>=0.15.12"
]

[project]
authors = [
  {name = "Vilar da Camara Neto", email = "vilarneto@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control",
  "Topic :: System :: Software Distribution"
]
dependencies = [
  "click>=8.3.3,<9.0.0",
  "pydantic>=2.13.4,<3.0.0",
  "pathspec>=1.1.1",
  "rich>=15.0.0",
  "rich-click>=1.9.8",
  "ruamel-yaml>=0.19,<0.20"
]
description = "Keeps a project's semantic version number in sync across every file that declares it, with optional Git release workflows"
license = "MIT"
name = "vbumper"
readme = "README.md"
requires-python = ">=3.14"
version = "0.3.0-rc.4"

[project.entry-points."vbumper.plugin"]
core = "vbumper.core.entry_point:CorePlugin"

[project.scripts]
vbump = "vbumper.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/vbumper"]

[tool.ruff]
include = ["src/**/*.py", "src/**/*.pyi", "tests/**/*.py"]
line-length = 100
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["F401"]
select = ["E", "I", "NPY", "PD", "RUF", "W"]
